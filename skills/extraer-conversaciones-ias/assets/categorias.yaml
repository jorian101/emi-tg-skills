# Catálogo canónico de categorías para clasificar conversaciones de IAs.
# Fuente de verdad: sources/conversaciones-ias/categorias.md (vault).
# DINÁMICO: si una conversación no encaja, agregar categoría AQUÍ + en el vault
# ANTES de clasificar. El agente NUNCA inventa una categoría fuera del catálogo.
#
# Formato: cada categoría -> tipo de obra del flujo SAC (backend obra.py).
# El caso concreto (Uscamayta, Mendoza) NO es categoría: va en casos-conocidos.

