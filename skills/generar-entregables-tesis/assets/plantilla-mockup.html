<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mockup del Asistente</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8fafc; color: #1f2933; font-family: "Nunito Sans", Arial, sans-serif; }
    .screen { position: relative; width: 1200px; height: 800px; background: #f8fafc; }
    /* Keep the imported DOM flat and use direct hex tokens for OpenPencil. */
    .sidebar { position: absolute; inset: 0 auto 0 0; width: 240px; background: #032154; }
    .content { position: absolute; left: 240px; top: 0; width: 960px; height: 800px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="sidebar"></div>
    <div class="content"></div>
  </div>
</body>
</html>
